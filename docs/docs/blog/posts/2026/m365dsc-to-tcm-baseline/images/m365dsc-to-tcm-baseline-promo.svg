<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Converting an M365DSC Configuration into a UTCM Baseline</title>
  <desc id="desc">A promotional image showing a Microsoft365DSC configuration flowing into a UTCM baseline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f4c81"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#061124" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="170" fill="#38bdf8" opacity="0.18"/>
  <circle cx="120" cy="545" r="210" fill="#60a5fa" opacity="0.16"/>
  <g filter="url(#shadow)">
    <rect x="90" y="160" width="355" height="250" rx="24" fill="#eff6ff"/>
    <rect x="755" y="160" width="355" height="250" rx="24" fill="#eff6ff"/>
  </g>
  <text x="140" y="220" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">M365DSC</text>
  <text x="140" y="272" fill="#334155" font-family="Cascadia Mono, Consolas, monospace" font-size="25">Configuration {</text>
  <text x="165" y="314" fill="#334155" font-family="Cascadia Mono, Consolas, monospace" font-size="25">AADPolicy</text>
  <text x="165" y="356" fill="#334155" font-family="Cascadia Mono, Consolas, monospace" font-size="25">EXORule</text>
  <text x="140" y="398" fill="#334155" font-family="Cascadia Mono, Consolas, monospace" font-size="25">}</text>
  <path d="M500 285h160" stroke="#bfdbfe" stroke-width="18" stroke-linecap="round"/>
  <path d="M625 235l70 59-70 59" fill="none" stroke="#bfdbfe" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="475" y="390" width="250" height="58" rx="29" fill="#dbeafe" opacity="0.95"/>
  <text x="515" y="429" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Convert</text>
  <text x="805" y="220" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">UTCM Baseline</text>
  <text x="805" y="272" fill="#334155" font-family="Cascadia Mono, Consolas, monospace" font-size="25">{</text>
  <text x="830" y="314" fill="#334155" font-family="Cascadia Mono, Consolas, monospace" font-size="25">"resources": []</text>
  <text x="830" y="356" fill="#334155" font-family="Cascadia Mono, Consolas, monospace" font-size="25">"parameters": []</text>
  <text x="805" y="398" fill="#334155" font-family="Cascadia Mono, Consolas, monospace" font-size="25">}</text>
  <text x="90" y="90" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800">From Microsoft365DSC to UTCM</text>
  <text x="92" y="128" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="26">Turn an extracted configuration into a reusable Tenant Configuration Management baseline</text>
</svg>
